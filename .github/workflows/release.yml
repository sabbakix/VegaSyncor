# Pubblica una release GitHub quando viene inviato un tag di versione.
#
#   git tag v0.2.0 && git push origin v0.2.0        → release normale ("latest")
#   git tag v0.2.0-rc1 && git push origin v0.2.0-rc1 → pre-release (non installata dal comando rapido)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # servono i tag precedenti per l'elenco delle novità

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Controllo formato del tag
        run: |
          echo "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || {
            echo "::error::Tag '${GITHUB_REF_NAME}' non valido: usare vX.Y.Z oppure vX.Y.Z-rc1"
            exit 1
          }

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build pacchetti
        run: packaging/build-release.sh "${GITHUB_REF_NAME}"

      - name: Verifica pacchetti
        run: |
          cd dist/release
          sha256sum -c SHA256SUMS
          for deb in *.deb; do dpkg-deb --info "$deb" >/dev/null; done
          sh -n vegasyncor-install.sh
          # il binario deve riportare la versione del tag
          dpkg-deb -x vegasyncor_*_amd64.deb /tmp/deb
          /tmp/deb/usr/bin/vegasyncor version | grep -F "${GITHUB_REF_NAME#v}"

      - name: Pubblica release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          cd dist/release
          ASSETS="vegasyncor-install.sh SHA256SUMS $(ls *.deb *.tar.gz)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG esiste già: aggiorno i file allegati"
            gh release upload "$TAG" $ASSETS --clobber
          else
            case "$TAG" in
              *-*) KIND="--prerelease" ;;
              *)   KIND="--latest" ;;
            esac
            gh release create "$TAG" $ASSETS --verify-tag $KIND \
              --title "VegaSyncor ${TAG#v}" --notes-file NOTES.md
          fi
