# Publishes a GitHub release when a version tag is pushed.
#
#   git tag v0.3.0 && git push origin v0.3.0        → normal release ("latest")
#   git tag v0.3.0-rc1 && git push origin v0.3.0-rc1 → pre-release (not installed by the quick install)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # previous tags are needed for the list of changes

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check tag format
        run: |
          echo "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || {
            echo "::error::Invalid tag '${GITHUB_REF_NAME}': use vX.Y.Z or vX.Y.Z-rc1"
            exit 1
          }

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build packages
        run: packaging/build-release.sh "${GITHUB_REF_NAME}"

      - name: Verify packages
        run: |
          cd dist/release
          sha256sum -c SHA256SUMS
          for deb in *.deb; do dpkg-deb --info "$deb" >/dev/null; done
          sh -n vegasyncor-install.sh
          # the binary must report the tag version
          dpkg-deb -x vegasyncor_*_amd64.deb /tmp/deb
          /tmp/deb/usr/bin/vegasyncor version | grep -F "${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          cd dist/release
          ASSETS="vegasyncor-install.sh SHA256SUMS $(ls *.deb *.tar.gz)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists: updating the attached files"
            gh release upload "$TAG" $ASSETS --clobber
          else
            case "$TAG" in
              *-*) KIND="--prerelease" ;;
              *)   KIND="--latest" ;;
            esac
            gh release create "$TAG" $ASSETS --verify-tag $KIND \
              --title "VegaSyncor ${TAG#v}" --notes-file NOTES.md
          fi
